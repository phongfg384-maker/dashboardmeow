<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meow Dashboard - Máy Chủ</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #1e1f22;
            --bg-sidebar: #2b2d31;
            --bg-card: #313338;
            --bg-hover: #3f4147;
            --accent: #5865F2;
            --accent-hover: #4752c4;
            --text-normal: #dbdee1;
            --text-muted: #949ba4;
            --text-header: #f2f3f5;
            --danger: #da373c;
            --success: #23a559;
        }

        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            font-family: 'Inter', sans-serif; 
        }

        body { 
            background-color: var(--bg-base); 
            color: var(--text-normal); 
            display: flex; 
            height: 100vh; 
            overflow: hidden; 
        }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-base); }
        ::-webkit-scrollbar-thumb { background: #1a1b1e; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #111214; }

        .sidebar {
            width: 260px;
            background-color: var(--bg-sidebar);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            border-right: 1px solid #1f2124;
            padding-bottom: 20px; /* Thêm padding dưới cùng */
        }

        .brand {
            height: 70px;
            display: flex;
            align-items: center;
            padding: 0 20px;
            border-bottom: 1px solid #1f2124;
            gap: 12px;
            text-decoration: none;
        }

        .brand img {
            width: 36px;
            height: 36px;
            object-fit: cover;
        }

        .brand span {
            font-size: 15px;
            font-weight: 800;
            color: var(--text-header);
            letter-spacing: 0.5px;
        }

        .menu {
            list-style: none;
            padding: 15px 10px;
            /* Bỏ flex: 1 ở đây để margin-top: auto của player hoạt động tốt hơn */
        }

        .menu li {
            padding: 10px 12px;
            margin-bottom: 4px;
            border-radius: 6px;
            cursor: pointer;
            color: var(--text-muted);
            font-weight: 500;
            font-size: 14.5px;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: all 0.2s;
        }

        .menu li:hover { background-color: var(--bg-hover); color: var(--text-normal); }
        .menu li.active { background-color: var(--accent); color: #fff; }

        /* --- 🎵 CSS CHO TRÌNH PHÁT NHẠC --- */
        .music-player {
            margin-top: auto; /* Tự động đẩy xuống sát đáy sidebar */
            margin-left: 10px;
            margin-right: 10px;
            background-color: var(--bg-card);
            border-radius: 8px;
            padding: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border: 1px solid #1f2124;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }

        .player-info {
            display: flex;
            align-items: center;
            gap: 10px;
            overflow: hidden;
        }

        .player-icon {
            background: linear-gradient(135deg, var(--accent), #eb459e);
            min-width: 35px;
            height: 35px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        .track-info {
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .track-name {
            font-size: 13px;
            font-weight: 700;
            color: var(--text-header);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .track-status {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .play-btn {
            background-color: var(--bg-hover);
            border: none;
            color: var(--text-header);
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            transition: 0.2s;
        }

        .play-btn:hover {
            background-color: var(--accent);
            color: #fff;
            transform: scale(1.05);
        }
        
        /* Hiệu ứng đĩa than quay khi đang phát nhạc */
        @keyframes spin { 100% { transform: rotate(360deg); } }
        .playing .player-icon { animation: spin 4s linear infinite; border-radius: 50%; }

        /* Khung nội dung chính */
        .main { 
            flex: 1; 
            padding: 40px; 
            overflow-y: auto; 
            background-color: var(--bg-base);
        }

        .title { margin-bottom: 30px; border-bottom: 1px solid #3f4147; padding-bottom: 16px; }
        .title h2 { color: var(--text-header); margin-bottom: 8px; font-size: 24px; font-weight: 700; }
        .title p { color: var(--text-muted); font-size: 14px; }
        
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }

        .card { 
            background: var(--bg-card); 
            padding: 24px; 
            border-radius: 12px; 
            text-align: center; 
            border: 1px solid #1f2124; 
            transition: 0.2s; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.1); 
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .card:hover { border-color: var(--accent); transform: translateY(-4px); }
        .card img { width: 75px; height: 75px; border-radius: 24px; margin-bottom: 16px; object-fit: cover; background: var(--bg-base); }
        
        .btn { display: inline-flex; align-items: center; justify-content: center; padding: 10px 20px; border-radius: 8px; text-decoration: none; font-weight: 600; font-size: 14px; width: 100%; color: #fff; transition: 0.2s; }
        .btn-primary { background: var(--accent); }
        .btn-primary:hover { background: var(--accent-hover); }
        .btn-secondary { background: var(--bg-hover); color: var(--text-header); }
        .btn-secondary:hover { background: #4e5058; }

        @media (max-width: 768px) {
            .sidebar { position: fixed; left: -260px; z-index: 1000; height: 100%; }
            .sidebar.active { left: 0; }
            .main { padding: 20px; }
        }
    </style>
</head>
<body>
    <nav class="sidebar">
        <a href="/dashboard" class="brand">
            <img src="/user_public/meow-logo.png" onerror="this.src='https://cdn.discordapp.com/embed/avatars/1.png';">
            <span>MEOW DASHBOARD</span>
        </a>
        <ul class="menu">
            <li class="active">🎛️ Danh sách Server</li>
            <li>
                <a href="/dashboard" style="color: inherit; text-decoration: none; display: flex; align-items: center; gap: 10px; width: 100%;">
                    🏠 Về Trang Chủ
                </a>
            </li>
        </ul>

        <!-- 🎵 THÊM KHỐI TRÌNH PHÁT NHẠC VÀO ĐÂY -->
        <div class="music-player" id="music-player">
            <!-- Đổi link mp3 ở phần src="" bên dưới thành bài nhạc bạn thích -->
            <audio id="bgm-audio" loop preload="none">
                <source src="https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf07a.mp3" type="audio/mpeg">
            </audio>
            
            <div class="player-info">
                <div class="player-icon">🎵</div>
                <div class="track-info">
                    <span class="track-name">Meow Chill Vibes</span>
                    <span class="track-status" id="track-status">Đang dừng</span>
                </div>
            </div>
            <button class="play-btn" id="play-btn">▶</button>
        </div>
    </nav>

    <div class="main">
        <div class="title">
            <h2>Máy chủ của bạn</h2>
            <p>Chọn một máy chủ để bắt đầu cấu hình các tính năng của bot.</p>
        </div>
        <div id="loading" style="color: var(--text-muted); font-size: 15px; padding: 20px 0;">Đang kết nối với Discord để lấy danh sách máy chủ...</div>
        <div class="grid" id="guild-grid"></div>
    </div>

    <script>
        // --- SCRIPT XỬ LÝ NHẠC ---
        const audio = document.getElementById('bgm-audio');
        const playBtn = document.getElementById('play-btn');
        const trackStatus = document.getElementById('track-status');
        const playerContainer = document.getElementById('music-player');

        // Giảm âm lượng mặc định xuống 30% để không làm giật mình
        audio.volume = 0.3;

        playBtn.addEventListener('click', () => {
            if (audio.paused) {
                audio.play();
                playBtn.innerHTML = '⏸';
                trackStatus.textContent = 'Đang phát...';
                playerContainer.classList.add('playing');
            } else {
                audio.pause();
                playBtn.innerHTML = '▶';
                trackStatus.textContent = 'Đã dừng';
                playerContainer.classList.remove('playing');
            }
        });

        // --- SCRIPT XỬ LÝ SERVER DANH SÁCH ---
        document.addEventListener('DOMContentLoaded', async () => {
            const grid = document.getElementById('guild-grid');
            const loadingEl = document.getElementById('loading');
            
            try {
                const res = await fetch('/api/user/guilds');
                if (loadingEl) loadingEl.style.display = 'none';

                if (!res.ok) {
                    grid.innerHTML = `
                        <div style="background:var(--bg-card); padding:30px; border-radius:12px; grid-column: 1/-1; text-align:center; border: 1px solid #1f2124;">
                            <p style="color:#da373c; margin-bottom:15px; font-weight:600; font-size:16px;">Phiên đăng nhập chưa có hoặc đã hết hạn.</p>
                            <a href="/public/login" class="btn btn-primary" style="max-width:220px; margin:0 auto;">Đăng nhập lại Discord</a>
                        </div>`;
                    return;
                }
                
                const guilds = await res.json();
                
                if (!Array.isArray(guilds) || guilds.length === 0) {
                    grid.innerHTML = `<p style="color:var(--text-muted); grid-column: 1/-1;">Không tìm thấy máy chủ nào mà bạn có quyền Quản trị viên (Administrator).</p>`;
                    return;
                }

                grid.innerHTML = guilds.map(g => {
                    const inviteLink = g.inviteUrl || `https://discord.com/api/oauth2/authorize?client_id=${g.botClientId || '1491052906496131296'}&permissions=8&scope=bot%20applications.commands&guild_id=${g.id}&disable_guild_select=true`;
                    return `
                    <div class="card">
                        <img src="${g.icon || 'https://cdn.discordapp.com/embed/avatars/0.png'}" onerror="this.src='https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/72x72/1f431.png'">
                        <h3 style="color:var(--text-header); margin-bottom:15px; font-size:16px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; width: 100%;" title="${g.name}">${g.name}</h3>
                        ${g.botInstalled 
                            ? `<a href="/public/config.html?guildId=${g.id}" class="btn btn-primary">⚙️ Cài đặt Server</a>` 
                            : `<a href="${inviteLink}" target="_blank" class="btn btn-secondary">➕ Thêm Bot</a>`}
                    </div>
                `}).join('');
            } catch (err) {
                if (loadingEl) loadingEl.style.display = 'none';
                grid.innerHTML = `<p style="color:#da373c; grid-column: 1/-1;">Lỗi kết nối tới máy chủ backend!</p>`;
            }
        });
    </script>
</body>
</html>
